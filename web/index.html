<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Şipşak: günde bir an, bir saat, tek kazanan. Arkadaşlarınla günün karesini seç.">
  <meta name="theme-color" content="#0E0E10">

  <!-- iPhone: ana ekrana eklenince tam ekran uygulama gibi açılır -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Şipşak">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Paylaşım önizlemesi -->
  <meta property="og:title" content="Şipşak">
  <meta property="og:description" content="Günde bir an. Bir saat. Tek kazanan.">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Şipşak</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0E0E10; overflow: hidden; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E0E10; color: #F4F1EA;
      font-family: -apple-system, system-ui, sans-serif;
      transition: opacity .25s ease;
    }
    #splash .mark {
      width: 84px; height: 84px; border-radius: 24px; background: #FFD23F;
      display: flex; align-items: center; justify-content: center;
      animation: pulse 1.1s ease-in-out infinite;
    }
    #splash .word { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    #splash .hint { font-size: 14px; color: #A9A6A0; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="#0E0E10" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
    </div>
    <div class="word">şipşak</div>
    <div class="hint">Yükleniyor…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
